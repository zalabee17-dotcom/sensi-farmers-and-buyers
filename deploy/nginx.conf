# Sensi reverse proxy config
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/sensi
#          sudo ln -s /etc/nginx/sites-available/sensi /etc/nginx/sites-enabled/sensi
#          sudo nginx -t && sudo systemctl reload nginx
# Then run: sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
